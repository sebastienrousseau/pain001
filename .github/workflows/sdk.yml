# SPDX-License-Identifier: Apache-2.0 OR MIT
name: 📦 Build Typed OpenAPI Client SDK

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - "pain001/api/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/sdk.yml"
      - ".github/requirements/**"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "pain001/api/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/sdk.yml"
      - ".github/requirements/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate, build, and smoke-test the Python client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 (with api extra) + build tooling
        run: |
          # Base runtime deps first (rich, xmlschema, defusedxml, ...),
          # then the api extra, then the package itself with --no-deps.
          # Omitting requirements.txt here broke the build: --no-deps
          # drops the base dependencies too, not just the extra's.
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r .github/requirements/api.txt
          pip install --require-hashes -r .github/requirements/build-test.txt
          pip install --require-hashes -r .github/requirements/bootstrap.txt
          PIP_NO_INDEX=1 python -m build --wheel --no-isolation
          python -m installer dist/*.whl
          pip check

      - name: Set up Node.js (for openapi-generator-cli)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Set up Java (openapi-generator runtime)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Export the OpenAPI schema
        run: |
          python scripts/export_openapi.py openapi.json
          test -s openapi.json
          python -c "import json; d=json.load(open('openapi.json')); assert d['openapi'].startswith('3.'); print('OpenAPI', d['openapi'], 'with', len(d.get('paths', {})), 'paths')"

      - name: Generate Python client with openapi-generator
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0+dev' }}
        run: |
          # Strip the leading `v` from a release tag so the package
          # version matches pain001.__version__ (acceptance criterion 5).
          VERSION=${PACKAGE_VERSION#v}
          npx -y @openapitools/openapi-generator-cli \
            generate \
            -i openapi.json \
            -g python \
            -o ./pain001-client \
            --package-name pain001_client \
            --additional-properties=packageVersion=${VERSION},projectName=pain001-client

      - name: Build the generated client
        run: |
          pip install --require-hashes -r .github/requirements/build-test.txt
          pip install --require-hashes -r .github/requirements/sdk-runtime.txt
          cd pain001-client
          # Runtime and build dependencies are hash-locked above. Never
          # resolve arbitrary dependencies from generated source metadata.
          PIP_NO_INDEX=1 python -m build --wheel --no-isolation
          python -m installer dist/*.whl
          pip check
          python -c "import pain001_client; print('client', pain001_client.__name__, 'OK')"

      - name: Smoke-test the generated client
        run: |
          python - <<'PY'
          # Acceptance criterion 3: each operation stub instantiates
          # without error. We import the generated API class lazily so
          # we don't hard-code an operation list (the generator names
          # them from the OpenAPI tags).
          import importlib
          import pkgutil

          import pain001_client

          for module_info in pkgutil.walk_packages(
              pain001_client.__path__, pain001_client.__name__ + "."
          ):
              importlib.import_module(module_info.name)
          print("imported every generated submodule OK")
          PY

      - name: Upload generated client as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pain001-client-${{ github.sha }}
          path: pain001-client/
