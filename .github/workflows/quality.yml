name: 🧬 Quality Benchmarks & Advanced Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation build (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras --with docs
      - run: poetry run python scripts/render_readme.py --check
      - run: poetry run python scripts/generate_api_docs.py
      - run: git diff --exit-code -- docs
      - run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html

  # Job 1: Mutation Testing (Fast on PR/Push, Full on Schedule)
  mutation-fast:
    runs-on: ubuntu-latest
    name: 🧬 Mutation Testing (Fast)
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      # No `|| true`: for months this step failed on a removed mutmut flag
      # and nobody saw it. The gate in the Makefile is the point of the job.
      - run: poetry run make mutate-fast
        timeout-minutes: 45
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-fast-results
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn

  # Job 2: Full Mutation Testing (Scheduled Weekly)
  mutation-full:
    runs-on: ubuntu-latest
    name: 🧬 Mutation Testing (Full - Weekly)
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: poetry run make mutate
        timeout-minutes: 300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-full-results
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn

  # Job 3: Performance Benchmarks
  benchmarks:
    runs-on: ubuntu-latest
    name: ⚡ Performance Benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: poetry run make perf
      - name: Time every self-checking feature example
        run: poetry run python benches/bench_features.py > .benchmarks/features.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: |
            .benchmarks/

  # Job 4: Coverage Report
  coverage:
    runs-on: ubuntu-latest
    name: 📊 Coverage Report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: poetry run make cov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 5: Lint (ruff)
  lint:
    runs-on: ubuntu-latest
    name: 🔍 Lint (ruff)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: poetry run make lint

      # Not a timing gate -- wall-clock and memory are not comparable
      # between runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: poetry run python benches/bench_generate.py --quick
      - name: Run the corpus benchmark
        run: poetry run python benches/bench_corpus.py --quick
      - name: Discover ten synthetic installed plugins
        run: poetry run python benches/bench_plugin_discovery.py

  typecheck:
    runs-on: ubuntu-latest
    name: 🔠 Typecheck And Guardrails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction
      - run: >
          poetry run mypy
          pain001/config/manager.py
          pain001/templates/registry.py
          pain001/templates/guardrails.py
          pain001/observability/__init__.py
          pain001/async_adapter.py
          tests/test_config_manager.py
          tests/test_template_registry.py
          tests/test_schema_guardrails.py
          tests/test_async_adapters.py
      - run: poetry run pytest -q --no-cov tests/test_schema_guardrails.py
