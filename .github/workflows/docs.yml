name: 📚 Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'pain001/__init__.py'
      - 'pyproject.toml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ❯ Set up Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: ❯ Install dependencies 📦
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r .github/requirements/docs.txt
          pip install --require-hashes -r .github/requirements/api.txt
          # --no-deps: the api extra's deps come from the pinned file
          # above, so pip never resolves fastapi/uvicorn unpinned.
          pip install --no-deps --use-pep517 ".[api]"

      - name: ❯ Export OpenAPI schema for the Scalar reference 📜
        run: |
          mkdir -p docs/_static
          python scripts/export_openapi.py docs/_static/openapi.json

      - name: ❯ Build Sphinx documentation 🔨
        run: |
          cd docs
          make html

      - name: ❯ Stage Scalar interactive reference 📚
        run: |
          set -euo pipefail
          cp docs/_static/api-reference.html docs/_build/html/api-reference.html
          cp docs/_static/openapi.json docs/_build/html/openapi.json
          # Smoke check: the rendered page references the Scalar
          # bundle and the schema is well-formed JSON.
          grep -q '@scalar/api-reference' docs/_build/html/api-reference.html
          python -c "import json; json.load(open('docs/_build/html/openapi.json'))"

      - name: ❯ Upload artifact 📤
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/_build/html'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ❯ Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
