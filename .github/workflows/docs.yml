# SPDX-License-Identifier: Apache-2.0 OR MIT
name: 📚 Deploy Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'pain001/__init__.py'
      - 'pyproject.toml'
      - 'poetry.lock'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ❯ Set up Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0

      - name: ❯ Install locked documentation and optional runtime dependencies 📦
        # Autodoc imports LSP, MCP, transport and policy modules too.
        # Poetry verifies the committed lock's artifact hashes, as in quality.yml.
        run: poetry install --no-interaction --only main,docs --all-extras

      - name: ❯ Export OpenAPI schema for the Scalar reference 📜
        run: |
          mkdir -p docs/_static
          poetry run python scripts/export_openapi.py docs/_static/openapi.json

      - name: ❯ Build Sphinx documentation 🔨
        run: |
          poetry run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: ❯ Stage Scalar interactive reference 📚
        run: |
          set -euo pipefail
          cp docs/_static/api-reference.html docs/_build/html/api-reference.html
          cp docs/_static/openapi.json docs/_build/html/openapi.json
          # Smoke check: the rendered page references the Scalar
          # bundle and the schema is well-formed JSON.
          grep -q '@scalar/api-reference' docs/_build/html/api-reference.html
          python -c "import json; json.load(open('docs/_build/html/openapi.json'))"

      - name: ❯ Upload artifact 📤
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/_build/html'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ❯ Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
