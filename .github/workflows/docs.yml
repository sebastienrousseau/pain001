name: 📚 Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'pain001/__init__.py'
      - 'pyproject.toml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ❯ Set up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: ❯ Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sphinx pydata-sphinx-theme sphinx-design "myst-parser[linkify]" sphinx-autodoc-typehints
          pip install --use-pep517 ".[api]"

      - name: ❯ Export OpenAPI schema for the Scalar reference 📜
        run: |
          mkdir -p docs/_static
          python scripts/export_openapi.py docs/_static/openapi.json

      - name: ❯ Build Sphinx documentation 🔨
        run: |
          cd docs
          make html

      - name: ❯ Stage Scalar interactive reference 📚
        run: |
          set -euo pipefail
          cp docs/_static/api-reference.html docs/_build/html/api-reference.html
          cp docs/_static/openapi.json docs/_build/html/openapi.json
          # Smoke check: the rendered page references the Scalar
          # bundle and the schema is well-formed JSON.
          grep -q '@scalar/api-reference' docs/_build/html/api-reference.html
          python -c "import json; json.load(open('docs/_build/html/openapi.json'))"

      - name: ❯ Upload artifact 📤
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'docs/_build/html'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ❯ Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
