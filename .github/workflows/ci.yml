name: 🧪 CI Regression & Enterprise Release

on:
  pull_request:
    branches: [main, "feat/*"]
  push:
    branches: [main, "feat/*", "feature/**", "fix/**"]
    tags:
      - "v*" # ✅ Correct trigger for version tags

# Concurrency: Cancel stale PR builds, but protect Main and Release builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 0. LOCKFILE (Fastest Fail - a stale lock breaks every later job)
  #
  # Every poetry job here already dies on a stale lock, but it dies
  # inside an install log with a dozen jobs red at once and nothing
  # saying which of them is the cause. This says it in one line, in
  # seconds, before anything else runs.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - name: ❯ Verify poetry.lock Is Current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi
          echo "✅ poetry.lock matches pyproject.toml."

  # 1. VERSION SYNC (Fastest Fail - 0s Setup)
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ❯ Verify Version Sync
        run: |
          # Extract versions without executing code (no dependencies required)
          V_INIT=$(grep -E "^__version__" pain001/__init__.py | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          V_TOML=$(grep -E "^version = " pyproject.toml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          V_CONST=$(grep -E "^VERSION = " pain001/constants.py | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")

          echo "🔍 Version Status:"
          echo "   Init:      $V_INIT"
          echo "   Toml:      $V_TOML"
          echo "   Constants: $V_CONST"

          if [ "$V_INIT" != "$V_TOML" ] || [ "$V_TOML" != "$V_CONST" ]; then
            echo "❌ CRITICAL: Version Desync Detected!"
            exit 1
          fi
          echo "✅ Version Sync Verified."

  # 2. TOLLGATES (Blocking - Latest Python)
  tollgates:
    needs: version-sync
    runs-on: ubuntu-latest
    name: 🛡️ Production Tollgates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ❯ Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "poetry" # ✅ Native Caching (Faster/Cleaner)

      - name: ❯ Install Dependencies
        run: poetry install --no-interaction --all-extras

      - name: 🛡️ Run Enterprise Tollgates
        run: poetry run make tollgates

  # 3. QUALITY GATE MATRIX (Parallel Compatibility Check)
  quality-gate:
    needs: tollgates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # ✅ Enterprise Matrix
    name: 🧬 Quality Gate (Py ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ❯ Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: ❯ Install Dependencies
        run: poetry install --no-interaction --all-extras

      - name: 🧪 Full Check
        run: poetry run make check

      # Upload coverage only once (from latest version)
      - name: 📊 Upload Coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # 4. RELEASE & PUBLISH (Only on Tags)
  publish:
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: 📦 Publish Release
    environment: pypi
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.dist_hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ❯ Verify Tag Matches Package Version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(grep -E "^version = " pyproject.toml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "Tag: $TAG_VERSION | Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag matches package version."

      - name: ❯ Extract Release Notes
        id: release_notes
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          NOTE_PATH="releases/v${TAG_VERSION}.md"
          if [ -f "$NOTE_PATH" ]; then
            echo "path=$NOTE_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ Release notes missing: $NOTE_PATH"
            exit 1
          fi

      - name: ❯ Install Poetry
        run: pipx install poetry==2.4.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "poetry"
      - run: poetry install --no-interaction --all-extras

      - name: ❯ Build & Metadata Check
        run: |
          poetry build
          poetry run twine check dist/*

      - name: ❯ Generate SBOM (CycloneDX + SPDX)
        # Enterprise vulnerability-management tools (Snyk, Black Duck,
        # Trivy) ingest SBOMs as a procurement checkbox. Attaching them
        # to each release means consumers can audit transitive deps
        # without re-resolving the lockfile.
        run: |
          mkdir -p sbom
          pip install --quiet --require-hashes -r .github/requirements/sbom.txt
          # CycloneDX (JSON + XML) - the industry default.
          cyclonedx-py environment --output-file sbom/pain001-${GITHUB_REF_NAME#v}.cdx.json
          cyclonedx-py environment --output-format xml --output-file sbom/pain001-${GITHUB_REF_NAME#v}.cdx.xml
          # SPDX manifest of installed packages with licences.
          pip-licenses --format=json --with-license-file --no-license-path \
            --output-file=sbom/pain001-${GITHUB_REF_NAME#v}.spdx-licenses.json
          ls -la sbom/

      # Every file attached to the release must be hashed here, not just
      # dist/. v0.0.57 attested all five assets; v0.0.58 attested only
      # the wheel and sdist, because this step hashed dist/ alone and
      # the SBOMs are written to sbom/ — they shipped unattested.
      # Hashing is done from inside each directory so the subject names
      # are bare filenames matching the release asset names; running
      # sha256sum over "dist/* sbom/*" would embed the directory in the
      # subject name and no verifier would match it.
      - name: ❯ Hash release assets for provenance
        id: dist_hashes
        # Subshells, not { } groups: a brace group runs in the current
        # shell, so the first cd would persist and the second would look
        # for dist/sbom, fail, and silently emit the dist-only list —
        # exactly the bug being fixed here. set -e makes that loud.
        run: |
          set -euo pipefail
          hashes=$( (cd dist && sha256sum -- *) ; (cd sbom && sha256sum -- *) )
          echo "$hashes"
          echo "hashes=$(printf '%s\n' "$hashes" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: ❯ Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            dist/*
            sbom/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ❯ Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # 5. SIGNED PROVENANCE (Only on Tags)
  #
  # This must live in the same workflow as the publish job: a release
  # created by a workflow using GITHUB_TOKEN does not trigger further
  # workflow runs, so a standalone `on: release: published` workflow can
  # never fire for our own pipeline.
  #
  # NOTE: the reusable generator MUST be referenced by tag, not SHA —
  # slsa-verifier validates the generator's own provenance against its
  # release tag. This is the documented exception to SHA pinning.
  provenance:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read   # read the workflow path
      id-token: write # sign via Sigstore OIDC
      contents: write # upload the attestation to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.hashes }}
      upload-assets: true
