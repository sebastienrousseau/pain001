name: 🛡️ Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Daily 02:00 UTC

permissions:
  contents: read

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    name: Vulnerability Scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - name: Generate pip-audit JSON report artifact
        run: poetry run pip-audit --format json --output pip-audit-report.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report
          path: pip-audit-report.json
      - name: Fail on known vulnerabilities
        # pip-audit can't resolve pain001's own dev version against
        # PyPI between commits and the release tag's publish step;
        # the post-publish nightly run audits the released artefact.
        run: poetry run pip-audit --progress-spinner off
      - name: Fail on known vulnerabilities in the hash-pinned tool sets
        # The docs, SBOM, fuzz and SDK jobs install from these files, not
        # from poetry.lock, so the environment audit above never sees
        # them: docs.txt pinned an affected certifi (GHSA-6q48-6c7w-9gw2)
        # with nothing reporting it. Every file is fully pinned and
        # hashed, so --no-deps --disable-pip audits exactly what installs.
        run: |
          set -euo pipefail
          for file in requirements.txt .github/requirements/*.txt; do
            echo "::group::$file"
            poetry run pip-audit --progress-spinner off --no-deps --disable-pip -r "$file"
            echo "::endgroup::"
          done

  licenses:
    runs-on: ubuntu-latest
    name: License Compliance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      # Report the licences of pain001's runtime environment, not of the
      # interpreter pip-licenses happens to be installed into.
      - run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/licence-tools"
          "$RUNNER_TEMP/licence-tools/bin/pip" install --require-hashes -r .github/requirements/sbom.txt
          poetry install --no-interaction --only main --all-extras --sync
          project_python="$(poetry env info --executable)"
          "$RUNNER_TEMP/licence-tools/bin/pip-licenses" --python "$project_python" --format=json > licenses.json
          "$RUNNER_TEMP/licence-tools/bin/pip-licenses" --python "$project_python" --format=markdown > LICENSES_REPORT.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: |
            licenses.json
            LICENSES_REPORT.md
