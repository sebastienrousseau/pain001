name: 🛡️ Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Daily 02:00 UTC

permissions:
  contents: read

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    name: Vulnerability Scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - name: Generate pip-audit JSON report artifact
        run: poetry run pip-audit --format json --output pip-audit-report.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-report
          path: pip-audit-report.json
      - name: Fail on known vulnerabilities
        # pip-audit can't resolve pain001's own dev version against
        # PyPI between commits and the release tag's publish step;
        # the post-publish nightly run audits the released artefact.
        run: poetry run pip-audit --progress-spinner off

  licenses:
    runs-on: ubuntu-latest
    name: License Compliance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: |
          pip install --require-hashes -r .github/requirements/sbom.txt
          pip-licenses --format=json > licenses.json
          pip-licenses --format=markdown > LICENSES_REPORT.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: |
            licenses.json
            LICENSES_REPORT.md
