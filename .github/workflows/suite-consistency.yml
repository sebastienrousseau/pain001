# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Suite Consistency

# Check every publication channel, including the four non-PyPI members.
#
# It runs daily and on demand, from this repository's own default-branch
# code, and never on another workflow's completion. The workflow_run
# trigger it had until 0.0.87 only ran it sooner, through a trigger
# class that can run with more trust than the event deserves. The core
# publishes first, so an audit straight after its release fails until
# the companions ship, and each companion runs the same audit after its
# own publication. Dispatch it here once the last member is out.
on:
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional historical version; empty audits the latest published family"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: suite-consistency
  cancel-in-progress: true

jobs:
  consistency:
    name: All nine publications agree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor suggests the `$/` self-repository form; actionlint 1.7.12,
      # the latest release, rejects it, so the workspace form stays until
      # actionlint accepts it.
      - uses: ./.github/actions/check-ecosystem # zizmor: ignore[self-repository] actionlint rejects $/
        with:
          version: ${{ inputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ecosystem-publication-report
          path: ecosystem-publication.json
          if-no-files-found: error
          retention-days: 14
