name: Suite Consistency

# Check every publication channel, including the four non-PyPI members.
# GITHUB_TOKEN-created releases do not trigger another release workflow.
# workflow_run observes the actual publishing jobs, including the separate
# OCI build. Always check trusted default-branch code, never upstream PR code.
on:
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional historical version; empty audits the latest published family"
        type: string
        default: ""
  workflow_run:
    workflows: ["ci", "🐳 Build & Publish Docker Image"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: suite-consistency
  cancel-in-progress: true

jobs:
  consistency:
    name: All nine publications agree
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v0.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/check-ecosystem
        with:
          version: ${{ inputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ecosystem-publication-report
          path: ecosystem-publication.json
          if-no-files-found: error
          retention-days: 14
