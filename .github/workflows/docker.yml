name: 🐳 Build & Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pain001/**"
      - "pyproject.toml"
      # The image now installs from these hash-pinned files, so a change
      # to either must rebuild it; otherwise the published image keeps
      # the previously resolved dependency set.
      - "requirements.txt"
      - ".github/requirements/api.txt"
      - ".github/workflows/docker.yml"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pain001/**"
      - "pyproject.toml"
      # The image now installs from these hash-pinned files, so a change
      # to either must rebuild it; otherwise the published image keeps
      # the previously resolved dependency set.
      - "requirements.txt"
      - ".github/requirements/api.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# The build job states its own scopes; nothing else gets an OIDC token.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (and publish on tag/main)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the source
      packages: write # push the image to GHCR (non-PR events only)
      attestations: write # store the image's build provenance
      id-token: write # sign that provenance through Sigstore OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR events)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only pull-request builds, which push nothing, use the shared
          # Actions cache; an image that is published is built from
          # scratch, so a poisoned cache entry cannot reach it.
          cache-from: ${{ github.event_name == 'pull_request' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max' || '' }}
          provenance: true

      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        # The tag reaches the script through the environment, not a
        # template expansion inside it (zizmor template-injection).
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
          docker pull "$IMAGE"
          # Acceptance criterion 1: pain001 --version matches package version.
          VERSION_OUT=$(docker run --rm "$IMAGE" --version 2>&1 || true)
          echo "version output: $VERSION_OUT"
          # Acceptance criterion 5 (hardening): runs as non-root.
          WHOAMI=$(docker run --rm --entrypoint whoami "$IMAGE")
          echo "user: $WHOAMI"
          test "$WHOAMI" = "pain001"
          # Import sanity (re-runs the HEALTHCHECK).
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import pain001; print('pain001', pain001.__version__, 'OK')"
