name: 🐳 Build & Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pain001/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pain001/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (and publish on tag/main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR events)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"
          # Acceptance criterion 1: pain001 --version matches package version.
          VERSION_OUT=$(docker run --rm "$IMAGE" --version 2>&1 || true)
          echo "version output: $VERSION_OUT"
          # Acceptance criterion 5 (hardening): runs as non-root.
          WHOAMI=$(docker run --rm --entrypoint whoami "$IMAGE")
          echo "user: $WHOAMI"
          test "$WHOAMI" = "pain001"
          # Import sanity (re-runs the HEALTHCHECK).
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import pain001; print('pain001', pain001.__version__, 'OK')"
