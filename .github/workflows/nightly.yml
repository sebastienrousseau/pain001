name: 🌙 Nightly Quality

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
      - run: poetry install --no-interaction --all-extras
      - run: make check
      - uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-nightly
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  fuzz:
    # Coverage-guided fuzzing of the raw-input validators (IBAN, BIC,
    # charset sanitisation) via the Atheris harness in fuzz/. Atheris
    # builds cleanly on the Linux runners; two minutes nightly is enough
    # to keep the never-raises contract honest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run atheris harness
        run: |
          pip install --quiet atheris .
          python fuzz/fuzz_validation.py -max_total_time=120
