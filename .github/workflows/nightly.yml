name: 🌙 Nightly Quality

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0
      - run: poetry install --no-interaction --all-extras
      - run: make check
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-nightly
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  fuzz:
    # Coverage-guided fuzzing of the raw-input validators (IBAN, BIC,
    # charset sanitisation) via the Atheris harness in fuzz/. Atheris
    # builds cleanly on the Linux runners; two minutes nightly is enough
    # to keep the never-raises contract honest.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run atheris harness
        run: |
          pip install --quiet --require-hashes -r .github/requirements/fuzz.txt
          pip install --quiet --no-deps .
          python fuzz/fuzz_validation.py -max_total_time=120
