name: 🔍 CodeQL Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run at 03:00 UTC daily (offset from other security scans)
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read
      # Required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports: 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras

      # Initializes the CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: ${{ matrix.language }}
          # Use custom config that registers validate_path as a sanitizer
          config-file: .github/codeql/codeql-config.yml
          # Override default queries with custom configuration
          queries: +security-and-quality
          # Advanced setup options
          setup-python-dependencies: false  # We handle this with Poetry
          
      # Autobuild attempts to build any compiled languages (C/C++, C#, Go, or Java)
      # For Python, this step is typically not needed, but we include it for completeness
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results to GitHub Security tab
          upload: true
          # Set severity threshold (optional)
          # Only fail on high/critical issues
          fail-on: error

      # Generate SARIF report summary
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-results-${{ matrix.language }}
          path: /home/runner/work/_temp/codeql_databases/python.sarif
          retention-days: 7

  security-gate:
    name: Security Gate Check
    needs: analyze
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CodeQL status
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "::error::CodeQL analysis failed or found critical issues"
            exit 1
          fi
          echo "✅ CodeQL security scan passed"
