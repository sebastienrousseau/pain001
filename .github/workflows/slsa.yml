# SLSA Build Level 3 provenance — MANUAL / BACKFILL path only.
#
# The normal path is the `provenance` job inside ci.yml, which runs
# straight after the publish job. This workflow exists to attest a
# release that was created outside that pipeline (or to backfill an
# older one) and is therefore dispatch-only: a release created by a
# workflow using GITHUB_TOKEN never emits a `release: published` event,
# so an automatic trigger here would silently never fire — which is
# exactly how v0.0.57 shipped without provenance on the first attempt.
#
# It hashes the assets of the named release and calls the SLSA generic
# generator, which signs an attestation on isolated infrastructure and
# uploads `*.intoto.jsonl` back to that release.
#
# Consumers verify with slsa-verifier:
#   slsa-verifier verify-artifact pain001-<v>.whl \
#     --provenance-path multiple.intoto.jsonl \
#     --source-uri github.com/sebastienrousseau/pain001
#
# TRADE-OFF, measured on the v0.0.58 backfill: provenance produced here
# records configSource as the ref this workflow was dispatched from —
# normally refs/heads/main — not the release tag. The command above
# passes, but the stricter `--source-tag vX.Y.Z` fails with
# "invalid ref". Dispatching with --ref <tag> would fix that only if
# the tag already contains this version of the file, which a backfill
# by definition cannot rely on.
#
# So prefer the in-pipeline job: ci.yml's `provenance` runs on the tag
# push, so its attestation binds to refs/tags/vX.Y.Z and (since 993eb97)
# covers every release asset. Use this workflow when that did not run.
#
# NOTE: the reusable generator MUST be referenced by tag, not SHA —
# slsa-verifier validates the generator's own provenance against its
# release tag. This is the documented exception to SHA pinning.

name: SLSA provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest, e.g. v0.0.57"
        required: true
        type: string

permissions: read-all

jobs:
  hashes:
    name: Hash release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -la assets

      # Exclude any existing attestation. `gh release download` with no
      # pattern fetches every asset, so re-attesting a release that
      # already has provenance would list multiple.intoto.jsonl as a
      # subject and then overwrite that exact file, leaving an
      # attestation whose own subject digest matches nothing on the
      # release. Dropping it first also makes a re-run idempotent: the
      # subject set is the release's real artefacts either way.
      - name: Compute base64-encoded subject hashes
        id: hash
        run: |
          set -euo pipefail
          cd assets
          rm -f -- *.intoto.jsonl
          ls -la
          test -n "$(ls -A)" || { echo "no assets to attest"; exit 1; }
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate signed provenance
    needs: hashes
    permissions:
      actions: read   # read the workflow path
      id-token: write # sign via Sigstore OIDC
      contents: write # upload the attestation to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.hashes }}
      upload-tag-name: ${{ inputs.tag }}
      upload-assets: true
