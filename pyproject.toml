# PEP 639 licence expression. Poetry maps a legacy `license = "..."`
# string to a single classifier and falls back to
# "License :: Other/Proprietary License" for a compound expression —
# actively misleading on an open-source project. Declaring it here
# emits `License-Expression: Apache-2.0 OR MIT` with no classifier.
[project]
name = "pain001"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSE-APACHE", "LICENSE-MIT"]
# Everything else still comes from [tool.poetry] below; declaring it
# dynamic keeps Poetry authoritative for those fields.
dynamic = [
    # [tool.poetry].version stays the single source of truth, so
    # scripts/preflight_release.py and the version-sync CI check keep
    # matching exactly one `version = "..."` line.
    "version",
    "dependencies",
    "optional-dependencies",
    "requires-python",
    "readme",
    "description",
    "authors",
    "keywords",
    "classifiers",
    "urls",
    "scripts",
]

[tool.poetry]
version = "0.0.70"
description = "Pain001 is a Python Library for Automating ISO 20022-Compliant Payment Files Using CSV Data."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
readme = "README.md"
repository = "https://github.com/sebastienrousseau/pain001"
homepage = "https://pain001.com"
packages = [
    { include = "pain001" },
]
include = [
    "pain001/py.typed",
    "pain001/schemas/*",
    "pain001/pain002/schemas/*.xsd",
    "pain001/templates/**/*",
    "pain001/config/*.yaml",
    "pain001/corpus/data/**/*",
    "pain001/corpus/schema/*.json",
    "pain001/migration/mappings/*.yaml",
    "pain001/test_fixtures/**/*",
]

[tool.poetry.scripts]
pain001 = "pain001.__main__:cli"
# In-tree MCP/LSP entry points are renamed to ``*-builtin`` so the
# standalone companion packages ``pain001-mcp`` and ``pain001-lsp``
# (see https://github.com/sebastienrousseau/pain001-mcp and
# https://github.com/sebastienrousseau/pain001-lsp) own the canonical
# command names. Either set works in isolation; installing both leaves
# the canonical names pointing at the standalone packages.
pain001-mcp-builtin = "pain001.mcp.server:main"
pain001-lsp-builtin = "pain001.lsp.server:main"

[tool.poetry.dependencies]
python = "^3.10"
click = ">=8.5.0,<9"
defusedxml = ">=0.7.1,<1"
jinja2 = ">=3.1.6,<4"
pyyaml = ">=6.0,<7.0"
paramiko = {version = ">=5.0,<6", optional = true}
cel-python = {version = ">=0.5,<0.6", optional = true}
holidays = {version = ">=0.105,<1", optional = true}
rich = ">=15.0.0,<16"
xmlschema = ">=4.3.2,<5.0.0"
# Optional: when present, libxml2 validates a generated document ~46x
# faster than the pure-Python validator, and validation is ~93% of the
# cost of producing one. Auto-detected — nothing changes if it is absent,
# and it can never turn a rejected document into an accepted one.
lxml = {version = ">=6.1.3,<7", optional = true}
jsonschema = ">=4.17,<5"
# Optional feature sets — install with
# pain001[api] / pain001[parquet] / pain001[mcp] / pain001[lsp] /
# pain001[redis] / pain001[gpg] / pain001[otel]
fastapi = {version = ">=0.141.1", optional = true}
uvicorn = {version = ">=0.53.0", extras = ["standard"], optional = true}
pyarrow = {version = ">=25.0.1,<26.0.0", optional = true}
mcp = {version = ">=2.1.1,<3", optional = true}
pygls = {version = ">=2.1,<3", optional = true}
redis = {version = ">=8.1.0,<9", optional = true}
python-gnupg = {version = ">=0.5,<1", optional = true}
opentelemetry-api = {version = ">=1.27,<2", optional = true}
opentelemetry-sdk = {version = ">=1.27,<2", optional = true}
opentelemetry-exporter-otlp-proto-http = {version = ">=1.27,<2", optional = true}

[tool.poetry.extras]
api = ["fastapi", "uvicorn"]
parquet = ["pyarrow"]
mcp = ["mcp"]
lsp = ["pygls"]
redis = ["redis"]
gpg = ["python-gnupg"]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]
fast = ["lxml"]
upload = ["paramiko"]
rules = ["cel-python", "holidays"]

[tool.poetry.group.dev.dependencies]
lxml = ">=6.1.3,<7"
httpx = ">=0.23"
fakeredis = ">=2.38.0,<3"
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
pytest-benchmark = "^5.3.0"
pytest-xdist = "^3.0.0"
mypy = "^2.3.1"
bandit = "^1.9.4"
pip-audit = ">=2.7,<3.0"
ruff = "^0.16.8"
types-defusedxml = "^0.7.0"
types-paramiko = "^5.0.0.20260724"
types-pyyaml = "^6.0.12"
diff-cover = "^10.5.1"
types-setuptools = "^84.0.0"
radon = "^6.0.1"
mutmut = "^3.8.0"
hypothesis = "^6.168.0"
memory-profiler = "^0.61.0"
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.1.0"
sphinx-autodoc-typehints = "^3.0.1"
pip-licenses = "^5.5.5"
twine = "^7.0.0"
types-jsonschema = "^4.26.0.20260518"
pandas = "^2.3.3"
wheel = ">=0.48.0"
interrogate = "^1.7.0"
pydoclint = "^0.9.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1.3"
pydata-sphinx-theme = "^0.19.0"
sphinx-autodoc-typehints = "^3.0.1"
sphinx-design = "^0.6.0"
myst-parser = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Coverage enforcement: 100% measured line and branch coverage.
# This is execution evidence, not proof of exhaustive behavioural coverage.
addopts = [
    "--cov=pain001",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=100",
    "--tb=short",
    "-ra",
    "--strict-markers",
]
filterwarnings = [
    "error",
    # the high-level API still defaults to the legacy output location
    "ignore:Calling generate_xml without output_path:DeprecationWarning",
    # third-party deprecations are reported by the dependency bump, not here
    "ignore::DeprecationWarning:xmlschema.*",
    "ignore::DeprecationWarning:elementpath.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # opentelemetry on Python 3.10/3.11 (importlib.metadata entry points)
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
    # pygls on Python 3.14
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

# Markers for test categorization
markers = [
    "integration: end-to-end workflow tests",
    "version_compat: pain.001 version compatibility tests (v03-v11)",
    "slow: tests taking > 1s",
    "security: XXE and injection prevention tests",
    "perf: performance/benchmark tests",
    "smoke: quick sanity checks"
]

# Timeout for blocking tests (5s default, prevent hangs)

# Parallel execution (xdist)
# Uncomment to enable: -n auto
# Note: Coverage aggregation works with xdist via .coveragerc

[tool.coverage.run]
branch = true
source = ["pain001"]

[tool.coverage.report]
# Exclude lines that are not meaningfully unit-testable, so the coverage
# figure reflects real behavioural coverage rather than entry-point glue.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 79
target-version = "py310"
# tests/test_suite_conformance.py carries a sha256 of its own bytes, so
# any reformatter rewriting it invalidates the check it exists to make.
extend-exclude = [".github/*.md", "*.md", "docs/**/*.md", "releases/**/*.md", "tmp_env", ".venv", ".eggs", "tests/test_suite_conformance.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (includes F811 reimport detection)
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# A standalone benchmark has to put the repository on sys.path
# before importing the package it measures, so its imports cannot
# come first.
"benches/*.py" = ["E402"]
"__init__.py" = ["F401", "E402"]  # re-exports after NullHandler setup

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "pain001/templates/",
    "setup.py",
    "scripts/",
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = [
    "arg-type",
    "return-value",
    "attr-defined",
    "assignment",
]

[[tool.mypy.overrides]]
module = "xmlschema.*"
ignore_missing_imports = true

# Optional feature extras (pain001[gpg] / pain001[otel]). The libraries
# ship without type stubs (gnupg) or are absent unless the extra is
# installed, so treat their imports as untyped rather than failing
# --strict when the extra is not present in the analysis environment.
[[tool.mypy.overrides]]
module = ["gnupg.*", "opentelemetry.*", "lxml.*"]
ignore_missing_imports = true

# pyarrow 24 ships py.typed but leaves parquet entry points
# (read_table, ParquetFile, iter_batches) unannotated.
[[tool.mypy.overrides]]
module = "pain001.parquet.load_parquet_data"
disallow_untyped_calls = false

[tool.codespell]
# Spelling gate for the docs-lint job and the pre-commit hook. ISO 20022
# element names and code lists are not English; skip generated and
# vendored trees rather than teaching the dictionary every tag.
skip = "./.git,./.venv,./htmlcov,./docs/_build,./poetry.lock,./pain001/templates,./pain001/schemas,./tests/golden,./tests/data,./releases,./CHANGELOG.md,./docs/posts,./docs/message-deltas.md,./scenarios,./pain001/tmp,./coverage.xml,*.xsd,*.xml,*.db,*.json,*.lock"
ignore-words-list = "dne,iban,bic,nam,ot,dtm,ccy,cdtr,dbtr,pmt,ustrd,strd,ctgy,purp,prtry,othr,mmb,fals,rcur,mandat,creat,ratio,te,inout,assertIn,ans,iff,shft,upto,nd,unparseable,intoto,fo"
quiet-level = 3

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
ignore-magic = true
exclude = ["setup.py", "scripts", "tests", "docs"]

[tool.pydoclint]
style = "google"
quiet = true
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = true
check-return-types = false
exclude = "(?:setup\\.py|scripts/|tests/|docs/|\\.venv/)"

[tool.mutmut]
# Mutation testing (mutmut 3). The fast tier on every pull request runs
# the mutants of the modules a wrong answer costs the most (see the
# Makefile's mutate-fast target, which filters by mutant name); the weekly
# job runs everything. mutmut 3 configures itself from this table only:
# the mutmut 2 flags the Makefile used to pass were rejected by 3.x, and
# the job swallowed that error for months (fixed 2026-09-18).
source_paths = ["pain001"]
# Two files describe the real checkout, not the working copy: the lazy
# import test sees mutmut's trampoline module, and the example scripts
# spawn the installed entry point and run as subprocesses outside the
# trampoline. Both are exercised by the ordinary test run; neither tests
# the logic a mutant changes. Every other test runs inside the copy.
pytest_add_cli_args = [
    "-q", "-p", "no:cacheprovider", "--no-cov", "-x",
    # Deterministic examples and no "differing executors" health check:
    # see the profile in conftest.py.
    "--hypothesis-profile=mutation",
    "--ignore=tests/test_lazy_imports.py",
    "--ignore=tests/test_examples.py",
]
# The example scripts and the corpus data are read by tests by path.
# mutmut runs the tests inside its working copy (mutants/), which holds
# only the source, tests and lock files. The tests here also import from
# scripts/, read the workflows, the docs and the governance files, and the
# root conftest pins the temp directory, so all of that is copied too.
also_copy = [
    "conftest.py", ".gitignore", "README.md", "CHANGELOG.md", "CONTRIBUTING.md",
    "SECURITY.md", "SCHEMES.md", "OPERATIONS.md", "LICENSE", "LICENSE-APACHE",
    "LICENSE-MIT", "Makefile", "Dockerfile", ".safety-policy.yml", ".github",
    "docs", "examples", "scenarios", "scripts", "benches", "requirements.txt",
    "DEVELOPMENT.md", "GOVERNANCE.md", "ARCHITECTURE.md", "SUPPORT.md",
    "RELEASING.md",
]
