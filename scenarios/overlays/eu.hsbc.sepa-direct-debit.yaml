# HSBC SEPA Direct Debit Core (HSBCnet, pain.008.001.02, HSBC Europe).
# Curated from the bank's usage guideline (2025; HSBC-restricted; not in
# this repository).
overlay_id: eu.hsbc.sepa-direct-debit
title: HSBC SEPA Direct Debit Core (HSBCnet, pain.008 v02)
applies_to: [sepa-direct-debit]
versions: [pain.008.001.02]
source:
  title: "HSBC SEPA Direct Debit Core usage guideline for pain.008.001.02, HSBCnet Europe"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    charge_bearer: SLEV
rules:
  - rule_id: hsbc-sdd-payment-type
    description: Payment type information with service level, local instrument and sequence type sits at the payment-information level.
    locator: PmtInf/PmtTpInf/SeqTp
    assertion: required
    error_code: HSBC_SDD_PMTTPINF
  - rule_id: hsbc-sdd-no-tx-payment-type
    description: Payment type information is not accepted at the transaction level.
    locator: DrctDbtTxInf/PmtTpInf
    assertion: forbidden
    error_code: HSBC_SDD_TX_PMTTPINF
  - rule_id: hsbc-sdd-service-level
    description: The service level is SEPA.
    locator: PmtTpInf/SvcLvl/Cd
    assertion: one_of:[SEPA]
    error_code: HSBC_SDD_SVCLVL
  - rule_id: hsbc-sdd-local-instrument-code
    description: The local instrument is a code (CORE or B2B), never proprietary.
    locator: LclInstrm/Prtry
    assertion: forbidden
    error_code: HSBC_SDD_LCLINSTRM_PRTRY
  - rule_id: hsbc-sdd-charge-bearer
    description: Charges follow the SEPA service level (SLEV).
    locator: ChrgBr
    assertion: one_of:[SLEV]
    error_code: HSBC_SDD_CHRGBR
  - rule_id: hsbc-sdd-creditor-agent-bic
    description: The creditor agent is identified by BIC.
    locator: PmtInf/CdtrAgt/FinInstnId/BIC
    assertion: required
    error_code: HSBC_SDD_CDTRAGT_BIC
  - rule_id: hsbc-sdd-debtor-agent-bic
    description: The debtor agent is identified by BIC.
    locator: DrctDbtTxInf/DbtrAgt/FinInstnId/BIC
    assertion: required
    error_code: HSBC_SDD_DBTRAGT_BIC
  - rule_id: hsbc-sdd-mandate
    description: Mandate id and date of signature are present.
    locator: MndtRltdInf/DtOfSgntr
    assertion: required
    error_code: HSBC_SDD_MANDATE
  - rule_id: hsbc-sdd-creditor-scheme
    description: The creditor scheme identification uses the SEPA proprietary scheme name.
    locator: CdtrSchmeId/Id/PrvtId/Othr/SchmeNm/Prtry
    assertion: one_of:[SEPA]
    error_code: HSBC_SDD_CDTRSCHMEID
  - rule_id: hsbc-sdd-iban-only
    description: Accounts are identified by IBAN only.
    locator: Acct/Id/Othr
    assertion: forbidden
    error_code: HSBC_SDD_ACCT_OTHR
