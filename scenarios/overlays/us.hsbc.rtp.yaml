# HSBC US Real Time Payment (HSBCnet, pain.001.001.03). Curated from the
# bank's usage guideline (2025; HSBC-restricted; not in this repository).
overlay_id: us.hsbc.rtp
title: HSBC US Real Time Payment (HSBCnet, v03)
applies_to: [instant-payment]
versions: [pain.001.001.03]
source:
  title: "HSBC US Real Time Payment usage guideline for pain.001.001.03, HSBCnet North America"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    debtor_agent: {name: null}
rules:
  - rule_id: hsbc-us-rtp-payment-type
    description: Payment type information with a service level sits at the payment-information level.
    locator: PmtInf/PmtTpInf/SvcLvl
    assertion: required
    error_code: HSBC_US_RTP_SVCLVL
  - rule_id: hsbc-us-rtp-debtor-routing
    description: The debtor agent carries an ABA routing number as clearing member id.
    locator: DbtrAgt/FinInstnId/ClrSysMmbId/MmbId
    assertion: required
    error_code: HSBC_US_RTP_DBTR_ROUTING
  - rule_id: hsbc-us-rtp-debtor-structured
    description: The debtor address is structured with town, state and country; address lines are not accepted.
    locator: Dbtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_US_RTP_DBTR_ADRLINE
  - rule_id: hsbc-us-rtp-debtor-state
    description: The debtor address carries a state as country subdivision.
    locator: Dbtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_US_RTP_DBTR_STATE
  - rule_id: hsbc-us-rtp-creditor-structured
    description: The creditor address is structured; address lines are not accepted.
    locator: Cdtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_US_RTP_CDTR_ADRLINE
  - rule_id: hsbc-us-rtp-no-equivalent-amount
    description: Equivalent amounts and exchange-rate information are not accepted.
    locator: EqvtAmt
    assertion: forbidden
    error_code: HSBC_US_RTP_EQVTAMT
  - rule_id: hsbc-us-rtp-no-iban
    description: Accounts are domestic account numbers, never IBANs.
    locator: DbtrAcct/Id/IBAN
    assertion: forbidden
    error_code: HSBC_US_RTP_IBAN
