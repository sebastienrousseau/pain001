# AEB SEPA files: the initiating party identified by a Spanish tax id
# (NIF) and, on direct debits, the Spanish creditor identifier.
overlay_id: es.aeb.sepa
title: AEB SEPA implementation guides, Rulebook 2025
applies_to: [es.sepa.sct-single, es.sepa.sdd-core]
source:
  title: "AEB, Guias de implantacion pain.001 v1.0 y SDD Core, Rulebook 2025 (Oct 2025)"
  read: "2026-09-10"
rules:
  - rule_id: es-aeb-initiating-party-nif
    description: The initiating party carries a Spanish tax id (NIF) as organisation identification.
    locator: InitgPty/Id/OrgId/Othr/Id
    assertion: if:InitgPty/Id:matches:[A-Z0-9][0-9]{7}[A-Z0-9]
    error_code: ES_AEB_NIF
  - rule_id: es-aeb-creditor-id
    description: The SEPA creditor identifier is the Spanish form ES + check + suffix + NIF.
    locator: CdtrSchmeId/Id/PrvtId/Othr/Id
    assertion: matches:ES[0-9]{2}[A-Z0-9]{3}[A-Z0-9][0-9]{7}[A-Z0-9]
    error_code: ES_AEB_CREDITOR_ID
