# HSBC Sweden Domestic High Value Payment, Virtual Presence (HSBCnet,
# pain.001.001.03). Curated from the bank's usage guideline (2025;
# HSBC-restricted; not in this repository): urgent SEK payments with
# structured addresses, category purpose INTC, no structured remittance.
overlay_id: se.hsbc.high-value
title: HSBC Sweden Domestic High Value Payment (HSBCnet Virtual Presence, v03)
applies_to: [se.rix.urgent]
versions: [pain.001.001.03]
source:
  title: "HSBC Sweden Virtual Presence Domestic High Value Payment usage guideline for pain.001.001.03, HSBCnet Europe"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    batch_booking: null
    debtor: {address: {form: structured, country_subdivision: Västerbotten}}
    debtor_agent: {clearing: {system: SESBA, member_id: "400515"}, address: {form: structured, country: SE}}
  transactions:
    "*":
      creditor: {address: {form: structured, country_subdivision: Stockholm}}
      creditor_agent: {address: {form: structured, country: SE}}
rules:
  - rule_id: hsbc-se-hvp-no-batch-booking
    description: Batch booking is not carried.
    locator: PmtInf/BtchBookg
    assertion: forbidden
    error_code: HSBC_SE_HVP_BTCHBOOKG
  - rule_id: hsbc-se-hvp-service-level
    description: The service level is URGP at the payment-information level.
    locator: PmtInf/PmtTpInf/SvcLvl/Cd
    assertion: one_of:[URGP]
    error_code: HSBC_SE_HVP_SVCLVL
  - rule_id: hsbc-se-hvp-category-purpose
    description: A category purpose is the code INTC.
    locator: PmtTpInf/CtgyPurp/Cd
    assertion: one_of:[INTC]
    error_code: HSBC_SE_HVP_CTGYPURP
  - rule_id: hsbc-se-hvp-payment-id-length
    description: The payment information id is at most 16 characters.
    locator: PmtInf/PmtInfId
    assertion: max_length:16
    error_code: HSBC_SE_HVP_PMTINFID_LEN
  - rule_id: hsbc-se-hvp-clearing-member
    description: The debtor agent carries the HSBC Sweden clearing member id.
    locator: DbtrAgt/FinInstnId/ClrSysMmbId/MmbId
    assertion: one_of:[400515]
    error_code: HSBC_SE_HVP_DBTRAGT_MMBID
  - rule_id: hsbc-se-hvp-debtor-address
    description: The debtor carries a structured address with town, country subdivision and country.
    locator: Dbtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_SE_HVP_DBTR_SUBDIV
  - rule_id: hsbc-se-hvp-debtor-no-lines
    description: Debtor address lines are not accepted.
    locator: Dbtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_SE_HVP_DBTR_ADRLINE
  - rule_id: hsbc-se-hvp-creditor-address
    description: The creditor carries a structured address with town, country subdivision and country SE.
    locator: Cdtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_SE_HVP_CDTR_SUBDIV
  - rule_id: hsbc-se-hvp-creditor-country
    description: The creditor is in Sweden.
    locator: Cdtr/PstlAdr/Ctry
    assertion: one_of:[SE]
    error_code: HSBC_SE_HVP_CDTR_CTRY
  - rule_id: hsbc-se-hvp-creditor-agent-country
    description: The creditor agent carries a postal address with the country SE.
    locator: CdtrAgt/FinInstnId/PstlAdr/Ctry
    assertion: one_of:[SE]
    error_code: HSBC_SE_HVP_CDTRAGT_CTRY
  - rule_id: hsbc-se-hvp-currency
    description: The instructed amount is in SEK.
    locator: InstdAmt/@Ccy
    assertion: one_of:[SEK]
    error_code: HSBC_SE_HVP_CCY
  - rule_id: hsbc-se-hvp-no-structured-remittance
    description: Remittance information is unstructured only.
    locator: RmtInf/Strd
    assertion: forbidden
    error_code: HSBC_SE_HVP_RMT_STRD
  - rule_id: hsbc-se-hvp-no-purpose
    description: A purpose code is not carried.
    locator: CdtTrfTxInf/Purp
    assertion: forbidden
    error_code: HSBC_SE_HVP_PURP
  - rule_id: hsbc-se-hvp-no-tx-local-instrument
    description: Local instrument is not carried at the transaction level.
    locator: CdtTrfTxInf/PmtTpInf/LclInstrm
    assertion: forbidden
    error_code: HSBC_SE_HVP_TX_LCLINSTRM
