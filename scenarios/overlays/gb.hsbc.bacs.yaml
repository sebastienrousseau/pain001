# HSBC UK BACS (HSBCnet, pain.001.001.03). Curated from the bank's usage
# guideline of 18 September 2025 (HSBC-restricted; not in this repository).
overlay_id: gb.hsbc.bacs
title: HSBC UK BACS (HSBCnet, v03)
applies_to: [bacs-direct-credit]
versions: [pain.001.001.03]
source:
  title: "HSBC UK BACS usage guideline for pain.001.001.03, HSBCnet"
  publisher: HSBC Direct Channels
  published: "2025-09-18"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    type: {service_level: NURG}
patches:
  gb.bacs.supplier-run:
    parties: {payer: {name: Elm Road Dev Ltd}}
rules:
  - rule_id: hsbc-bacs-service-level
    description: HSBC UK BACS carries the service level NURG.
    locator: PmtTpInf/SvcLvl/Cd
    assertion: one_of:[NURG]
    error_code: HSBC_BACS_SVCLVL
  - rule_id: hsbc-bacs-payment-type-present
    description: Payment type information is present at the payment-information level.
    locator: PmtInf/PmtTpInf
    assertion: required
    error_code: HSBC_BACS_PMTTPINF
  - rule_id: hsbc-bacs-debtor-name
    description: The debtor name is at most 18 characters (the Bacs originator name).
    locator: Dbtr/Nm
    assertion: max_length:18
    error_code: HSBC_BACS_DBTR_NM_LEN
  - rule_id: hsbc-bacs-sun
    description: The debtor organisation id carries the six-character service user number.
    locator: Dbtr/Id/OrgId/Othr/Id
    assertion: max_length:6
    error_code: HSBC_BACS_SUN_LEN
  - rule_id: hsbc-bacs-no-private-debtor-id
    description: A private identification for the debtor is not accepted.
    locator: Dbtr/Id/PrvtId
    assertion: forbidden
    error_code: HSBC_BACS_DBTR_PRVTID
  - rule_id: hsbc-bacs-sort-code-length
    description: Sort codes are six characters.
    locator: FinInstnId/ClrSysMmbId/MmbId
    assertion: max_length:6
    error_code: HSBC_BACS_SORT_CODE_LEN
  - rule_id: hsbc-bacs-account-number
    description: Account numbers are at most eight characters.
    locator: Acct/Id/Othr/Id
    assertion: max_length:8
    error_code: HSBC_BACS_ACCT_LEN
  - rule_id: hsbc-bacs-references
    description: Payment information and end-to-end ids are at most 18 characters.
    locator: PmtId/EndToEndId
    assertion: max_length:18
    error_code: HSBC_BACS_E2E_LEN
  - rule_id: hsbc-bacs-no-intermediary
    description: An intermediary agent is not accepted on a Bacs payment.
    locator: IntrmyAgt1
    assertion: forbidden
    error_code: HSBC_BACS_INTRMY
  - rule_id: hsbc-bacs-no-equivalent-amount
    description: Equivalent amounts are not accepted.
    locator: EqvtAmt
    assertion: forbidden
    error_code: HSBC_BACS_EQVTAMT
