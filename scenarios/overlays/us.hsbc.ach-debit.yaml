# HSBC US ACH debit (HSBCnet, pain.008.001.02). Curated from the bank's
# usage guideline (2025; HSBC-restricted; not in this repository): no
# batch booking, counts or control sum at the payment-information level,
# no service level or sequence type, agents by routing number not BIC.
overlay_id: us.hsbc.ach-debit
title: HSBC US ACH debit (HSBCnet, pain.008 v02)
applies_to: [ach-debit]
versions: [pain.008.001.02]
source:
  title: "HSBC US direct debit usage guideline for pain.008.001.02, HSBCnet North America"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    batch_booking: null
    type: {sequence_type: null}
    creditor_agent: {bic: null}
  transactions:
    "*":
      debtor_agent: {bic: null}
rules:
  - rule_id: hsbc-us-achd-no-batch-booking
    description: Batch booking is not accepted.
    locator: BtchBookg
    assertion: forbidden
    error_code: HSBC_US_ACHD_BTCHBOOKG
  - rule_id: hsbc-us-achd-no-service-level
    description: A service level is not accepted.
    locator: PmtTpInf/SvcLvl
    assertion: forbidden
    error_code: HSBC_US_ACHD_SVCLVL
  - rule_id: hsbc-us-achd-no-sequence-type
    description: A sequence type is not accepted.
    locator: PmtTpInf/SeqTp
    assertion: forbidden
    error_code: HSBC_US_ACHD_SEQTP
  - rule_id: hsbc-us-achd-no-creditor-agent-bic
    description: The creditor agent is identified by routing number, not BIC.
    locator: CdtrAgt/FinInstnId/BIC
    assertion: forbidden
    error_code: HSBC_US_ACHD_CDTRAGT_BIC
  - rule_id: hsbc-us-achd-no-debtor-agent-bic
    description: The debtor agent is identified by routing number, not BIC.
    locator: DbtrAgt/FinInstnId/BIC
    assertion: forbidden
    error_code: HSBC_US_ACHD_DBTRAGT_BIC
  - rule_id: hsbc-us-achd-creditor-routing
    description: The creditor agent carries an ABA routing number.
    locator: PmtInf/CdtrAgt/FinInstnId/ClrSysMmbId/MmbId
    assertion: required
    error_code: HSBC_US_ACHD_CDTR_ROUTING
