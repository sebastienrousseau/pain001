# HSBC UK TARGET and International Payments (HSBCnet, pain.001.001.03):
# CHAPS, TARGET2 and cross-border from a UK account. Curated from the
# bank's usage guideline (2025; HSBC-restricted; not in this repository).
overlay_id: gb.hsbc.priority
title: HSBC UK Priority and International Payments (HSBCnet, v03)
applies_to: [priority-payment]
source:
  title: "HSBC UK TARGET and International Payments usage guideline for pain.001.001.03, HSBCnet"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    batch_booking: null
    debtor: {address: {form: structured}}
  transactions:
    "*":
      creditor: {address: {form: structured}}
patches:
  gb.chaps.property-purchase:
    payment: {debtor: {address: {country_subdivision: England}}}
    transactions:
      "*": {creditor: {address: {country_subdivision: England}}}
  gb.international.usd:
    payment: {debtor: {address: {country_subdivision: England}}}
rules:
  - rule_id: hsbc-prty-service-level
    description: Priority payments carry SDVA, URGP or PRPT as service level.
    locator: PmtTpInf/SvcLvl/Cd
    assertion: one_of:[PRPT, SDVA, URGP]
    error_code: HSBC_PRTY_SVCLVL
  - rule_id: hsbc-prty-charge-bearer
    description: The charge bearer is DEBT, CRED or SHAR.
    locator: ChrgBr
    assertion: one_of:[DEBT, CRED, SHAR]
    error_code: HSBC_PRTY_CHRGBR
  - rule_id: hsbc-prty-no-batch-booking
    description: Batch booking is not accepted.
    locator: BtchBookg
    assertion: forbidden
    error_code: HSBC_PRTY_BTCHBOOKG
  - rule_id: hsbc-prty-debtor-structured-address
    description: The debtor address is structured; address lines are not accepted.
    locator: Dbtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_PRTY_DBTR_ADRLINE
  - rule_id: hsbc-prty-creditor-structured-address
    description: The creditor address is structured; address lines are not accepted.
    locator: Cdtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_PRTY_CDTR_ADRLINE
  - rule_id: hsbc-prty-debtor-town
    description: The debtor address carries town, country subdivision and country.
    locator: Dbtr/PstlAdr/TwnNm
    assertion: required
    error_code: HSBC_PRTY_DBTR_TOWN
  - rule_id: hsbc-prty-debtor-subdivision
    description: The debtor address carries a country subdivision.
    locator: Dbtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_PRTY_DBTR_SUBDIV
  - rule_id: hsbc-prty-creditor-town
    description: The creditor address carries town, country subdivision and country.
    locator: Cdtr/PstlAdr/TwnNm
    assertion: if:Cdtr:required
    error_code: HSBC_PRTY_CDTR_TOWN
  - rule_id: hsbc-prty-creditor-subdivision
    description: The creditor address carries a country subdivision.
    locator: Cdtr/PstlAdr/CtrySubDvsn
    assertion: if:Cdtr:required
    error_code: HSBC_PRTY_CDTR_SUBDIV
  - rule_id: hsbc-prty-no-tx-priority
    description: Instruction priority sits at the payment-information level only.
    locator: CdtTrfTxInf/PmtTpInf/InstrPrty
    assertion: forbidden
    error_code: HSBC_PRTY_TX_INSTRPRTY
