# HSBC US Low Value Payment (ACH) (HSBCnet, pain.001.001.03). Curated from
# the bank's usage guideline (2025; HSBC-restricted; not in this repository).
overlay_id: us.hsbc.ach
title: HSBC US ACH (HSBCnet, v03)
applies_to: [ach-credit]
versions: [pain.001.001.03]
source:
  title: "HSBC US Low Value Payment usage guideline for pain.001.001.03, HSBCnet North America"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    type: {service_level: NURG}
rules:
  - rule_id: hsbc-us-ach-service-level
    description: ACH files carry the service level NURG at the payment-information level.
    locator: PmtInf/PmtTpInf/SvcLvl/Cd
    assertion: one_of:[NURG]
    error_code: HSBC_US_ACH_SVCLVL
  - rule_id: hsbc-us-ach-company-id
    description: The debtor carries its company identification as an organisation id.
    locator: Dbtr/Id/OrgId/Othr/Id
    assertion: required
    error_code: HSBC_US_ACH_COMPANY_ID
  - rule_id: hsbc-us-ach-no-iban
    description: Accounts are domestic account numbers, never IBANs.
    locator: Acct/Id/IBAN
    assertion: forbidden
    error_code: HSBC_US_ACH_IBAN
  - rule_id: hsbc-us-ach-debtor-routing
    description: The debtor agent carries an ABA routing number as clearing member id.
    locator: DbtrAgt/FinInstnId/ClrSysMmbId/MmbId
    assertion: required
    error_code: HSBC_US_ACH_DBTR_ROUTING
  - rule_id: hsbc-us-ach-creditor-routing
    description: The creditor agent carries an ABA routing number as clearing member id.
    locator: CdtrAgt/FinInstnId/ClrSysMmbId/MmbId
    assertion: required
    error_code: HSBC_US_ACH_CDTR_ROUTING
  - rule_id: hsbc-us-ach-agent-country
    description: Agent addresses carry a country.
    locator: FinInstnId/PstlAdr/Ctry
    assertion: if:FinInstnId/PstlAdr:required
    error_code: HSBC_US_ACH_AGENT_CTRY
  - rule_id: hsbc-us-ach-no-intermediary
    description: Intermediary agents beyond the first are not accepted on ACH.
    locator: IntrmyAgt2
    assertion: forbidden
    error_code: HSBC_US_ACH_INTRMY
  - rule_id: hsbc-us-ach-no-equivalent-amount
    description: Equivalent amounts are not accepted.
    locator: EqvtAmt
    assertion: forbidden
    error_code: HSBC_US_ACH_EQVTAMT
