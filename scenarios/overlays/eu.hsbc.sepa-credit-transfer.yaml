# HSBC SEPA Credit Transfer (HSBCnet, pain.001.001.03, HSBC Europe).
# Curated from the bank's usage guideline (2025; HSBC-restricted; not in
# this repository).
overlay_id: eu.hsbc.sepa-credit-transfer
title: HSBC SEPA Credit Transfer (HSBCnet, v03)
applies_to: [sepa-credit-transfer]
versions: [pain.001.001.03]
source:
  title: "HSBC SEPA Credit Transfer usage guideline for pain.001.001.03, HSBCnet Europe"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    type: {service_level: SEPA}
    charge_bearer: SLEV
rules:
  - rule_id: hsbc-sct-service-level
    description: The service level is SEPA and is present at the payment-information level.
    locator: PmtInf/PmtTpInf/SvcLvl/Cd
    assertion: one_of:[SEPA]
    error_code: HSBC_SCT_SVCLVL
  - rule_id: hsbc-sct-service-level-present
    description: Payment type information with a service level is present.
    locator: PmtInf/PmtTpInf/SvcLvl
    assertion: required
    error_code: HSBC_SCT_SVCLVL_MISSING
  - rule_id: hsbc-sct-no-proprietary-service-level
    description: A proprietary service level is not accepted.
    locator: SvcLvl/Prtry
    assertion: forbidden
    error_code: HSBC_SCT_SVCLVL_PRTRY
  - rule_id: hsbc-sct-charge-bearer
    description: Charges follow the SEPA service level (SLEV).
    locator: ChrgBr
    assertion: one_of:[SLEV]
    error_code: HSBC_SCT_CHRGBR
  - rule_id: hsbc-sct-creditor-agent-bic
    description: The creditor agent is identified by BIC.
    locator: CdtrAgt/FinInstnId/BIC
    assertion: if:CdtrAgt:required
    error_code: HSBC_SCT_CDTRAGT_BIC
  - rule_id: hsbc-sct-creditor
    description: Creditor name and account are present on every transaction.
    locator: CdtTrfTxInf/Cdtr/Nm
    assertion: required
    error_code: HSBC_SCT_CDTR
  - rule_id: hsbc-sct-creditor-account
    description: The creditor account is present.
    locator: CdtTrfTxInf/CdtrAcct
    assertion: required
    error_code: HSBC_SCT_CDTRACCT
  - rule_id: hsbc-sct-no-charges-account-agent
    description: A charges account agent is not accepted.
    locator: ChrgsAcctAgt
    assertion: forbidden
    error_code: HSBC_SCT_CHRGSACCTAGT
