# HSBC Switzerland TARGET and International Payments (HSBCnet,
# pain.001.001.03). Curated from the bank's usage guideline (2025;
# HSBC-restricted; not in this repository): urgent and cross-border
# payments with fully structured debtor and creditor addresses.
overlay_id: ch.hsbc.target-international
title: HSBC Switzerland TARGET and International Payments (HSBCnet, v03)
applies_to: [ch.international.usd]
versions: [pain.001.001.03]
source:
  title: "HSBC Switzerland TARGET and International Payments usage guideline for pain.001.001.03, HSBCnet Europe"
  publisher: HSBC Direct Channels
  published: "2025"
  read: "2026-09-11"
  access: restricted (HSBC client documentation; not redistributed)
patch:
  payment:
    debtor: {address: {form: structured}}
    debtor_agent: {address: {form: structured, country: CH}}
  transactions:
    "*":
      end_to_end_id: AFM-X-0921-001
      creditor: {address: {form: structured}}
      creditor_agent: {address: {form: structured, country: US}}
rules:
  - rule_id: hsbc-ch-hvp-service-level
    description: The service level is PRPT, SDVA or URGP.
    locator: PmtTpInf/SvcLvl/Cd
    assertion: one_of:[PRPT, SDVA, URGP]
    error_code: HSBC_CH_HVP_SVCLVL
  - rule_id: hsbc-ch-hvp-charge-bearer
    description: Charges are borne DEBT, CRED or SHAR; SLEV is not accepted.
    locator: PmtInf/ChrgBr
    assertion: one_of:[DEBT, CRED, SHAR]
    error_code: HSBC_CH_HVP_CHRGBR
  - rule_id: hsbc-ch-hvp-no-tx-priority
    description: Instruction priority sits at the payment-information level only.
    locator: CdtTrfTxInf/PmtTpInf/InstrPrty
    assertion: forbidden
    error_code: HSBC_CH_HVP_TX_INSTRPRTY
  - rule_id: hsbc-ch-hvp-debtor-address
    description: The debtor carries a structured address with town, country subdivision and country.
    locator: Dbtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_CH_HVP_DBTR_SUBDIV
  - rule_id: hsbc-ch-hvp-debtor-no-lines
    description: Debtor address lines are not accepted.
    locator: Dbtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_CH_HVP_DBTR_ADRLINE
  - rule_id: hsbc-ch-hvp-creditor-address
    description: The creditor carries a structured address with town, country subdivision and country.
    locator: Cdtr/PstlAdr/CtrySubDvsn
    assertion: required
    error_code: HSBC_CH_HVP_CDTR_SUBDIV
  - rule_id: hsbc-ch-hvp-creditor-no-lines
    description: Creditor address lines are not accepted.
    locator: Cdtr/PstlAdr/AdrLine
    assertion: forbidden
    error_code: HSBC_CH_HVP_CDTR_ADRLINE
  - rule_id: hsbc-ch-hvp-debtor-iban
    description: The debtor account is an IBAN.
    locator: DbtrAcct/Id/Othr
    assertion: forbidden
    error_code: HSBC_CH_HVP_DBTRACCT_OTHR
  - rule_id: hsbc-ch-hvp-creditor-agent-country
    description: The creditor agent carries a postal address with the country.
    locator: CdtrAgt/FinInstnId/PstlAdr/Ctry
    assertion: if:CdtrAgt:required
    error_code: HSBC_CH_HVP_CDTRAGT_CTRY
  - rule_id: hsbc-ch-hvp-end-to-end-length
    description: The end-to-end id is at most 16 characters.
    locator: PmtId/EndToEndId
    assertion: max_length:16
    error_code: HSBC_CH_HVP_E2E_LEN
  - rule_id: hsbc-ch-hvp-intermediary-bic-only
    description: An intermediary agent is identified by BIC only.
    locator: IntrmyAgt1/FinInstnId/Othr
    assertion: forbidden
    error_code: HSBC_CH_HVP_INTRMY_OTHR
