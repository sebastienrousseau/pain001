---
# Codacy Configuration for Pain001
# Suppress false positives and test-specific patterns

exclude_paths:
  - ".github/copilot-instructions.md"
  - ".github/agents/**"
  - "CONTRIBUTING.md"
  - "docs/**"
  - "releases/**"
  - ".venv/**"
  - "__pycache__/**"
  - "dist/**"
  - "build/**"
  - "*.egg-info/**"
  - "htmlcov/**"

engines:
  markdownlint:
    enabled: true
    exclude_paths:
      - ".github/copilot-instructions.md"
    rules:
      MD013:
        enabled: false
      MD033:
        enabled: false
  
  pylint:
    enabled: true
    exclude_paths:
      - "tests/**"
      - "generate_xml_examples.py"
    python_version: 3
  
  prospector:
    enabled: true
    exclude_paths:
      - "tests/**"
  
  bandit:
    enabled: false  # Using manual security audits + CodeQL
  
  ruff:
    enabled: true
